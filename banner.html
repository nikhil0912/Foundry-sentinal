<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Foundry Sentinel Banner</title>
<style>body { margin:0; background:#000; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }</style>
</head><body>
<svg viewBox="0 0 1600 840" xmlns="http://www.w3.org/2000/svg" width="1600" height="840">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0a0a0f"/><stop offset="50%" style="stop-color:#15151f"/><stop offset="100%" style="stop-color:#0a0a0f"/></linearGradient>
  <radialGradient id="centerGlow" cx="50%" cy="45%" r="55%"><stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:0.4"/><stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0"/></radialGradient>
  <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#c7d2fe"/><stop offset="50%" style="stop-color:#a78bfa"/><stop offset="100%" style="stop-color:#4ade80"/></linearGradient>

  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="bigGlow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

  <!-- Agent gradients -->
  <radialGradient id="ng-red" cx="50%" cy="50%" r="50%"><stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.9"/><stop offset="70%" style="stop-color:#991b1b;stop-opacity:0.4"/><stop offset="100%" style="stop-color:#7f1d1d;stop-opacity:0"/></radialGradient>
  <radialGradient id="ng-blue" cx="50%" cy="50%" r="50%"><stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.9"/><stop offset="70%" style="stop-color:#2563eb;stop-opacity:0.4"/><stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:0"/></radialGradient>
  <radialGradient id="ng-purple" cx="50%" cy="50%" r="50%"><stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.95"/><stop offset="70%" style="stop-color:#7c3aed;stop-opacity:0.4"/><stop offset="100%" style="stop-color:#5b21b6;stop-opacity:0"/></radialGradient>
  <radialGradient id="ng-green" cx="50%" cy="50%" r="50%"><stop offset="0%" style="stop-color:#4ade80;stop-opacity:0.9"/><stop offset="70%" style="stop-color:#059669;stop-opacity:0.4"/><stop offset="100%" style="stop-color:#065f46;stop-opacity:0"/></radialGradient>

  <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.1"/><stop offset="50%" style="stop-color:#a78bfa;stop-opacity:0.7"/><stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.1"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a78bfa"/></marker>
</defs>

<rect width="1600" height="840" fill="url(#bg)"/>
<rect width="1600" height="840" fill="url(#centerGlow)"/>

<!-- grid -->
<g opacity="0.04">
<line x1="0" y1="200" x2="1600" y2="200" stroke="#a78bfa"/>
<line x1="0" y1="400" x2="1600" y2="400" stroke="#a78bfa"/>
<line x1="0" y1="600" x2="1600" y2="600" stroke="#a78bfa"/>
<line x1="400" y1="0" x2="400" y2="840" stroke="#a78bfa"/>
<line x1="800" y1="0" x2="800" y2="840" stroke="#a78bfa"/>
<line x1="1200" y1="0" x2="1200" y2="840" stroke="#a78bfa"/>
</g>

<!-- Title -->
<text x="800" y="92" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="800" fill="url(#titleGrad)" filter="url(#glow)" letter-spacing="-1">🛡️ Foundry Sentinel</text>
<text x="800" y="135" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#94a3b8" letter-spacing="1">Multi-Agent Responsible AI Assurance for Enterprise Learning</text>
<text x="800" y="167" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b" letter-spacing="3">REASONING AGENTS TRACK · MICROSOFT AGENTS LEAGUE 2026</text>

<!-- Badges -->
<g transform="translate(580, 198)">
  <rect x="0" y="0" width="160" height="32" rx="16" fill="rgba(167,139,250,0.15)" stroke="#a78bfa" stroke-width="1"/>
  <text x="80" y="21" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#a78bfa">⬡ FOUNDRY IQ</text>
</g>
<g transform="translate(760, 198)">
  <rect x="0" y="0" width="180" height="32" rx="16" fill="rgba(74,222,128,0.12)" stroke="#4ade80" stroke-width="1"/>
  <text x="90" y="21" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#4ade80">🛡️ RESPONSIBLE AI</text>
</g>
<g transform="translate(960, 198)">
  <rect x="0" y="0" width="180" height="32" rx="16" fill="rgba(96,165,250,0.12)" stroke="#60a5fa" stroke-width="1"/>
  <text x="90" y="21" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#60a5fa">◈ GITHUB COPILOT</text>
</g>

<!-- ELA top -->
<g transform="translate(640, 270)">
  <rect x="0" y="0" width="320" height="80" rx="12" fill="rgba(239,68,68,0.08)" stroke="#ef4444" stroke-width="2"/>
  <text x="160" y="22" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#ef4444" letter-spacing="2">⚠ SYSTEM UNDER AUDIT</text>
  <text x="160" y="46" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">Enterprise Learning Agent</text>
  <text x="160" y="66" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94a3b8">12 biased training recommendations</text>
</g>

<line x1="800" y1="350" x2="800" y2="390" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrow)"/>

<!-- 3-agent pipeline -->
<path d="M 360 480 Q 440 480 520 480" stroke="url(#edgeGrad)" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M 920 480 Q 1000 480 1080 480" stroke="url(#edgeGrad)" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

<!-- particles -->
<circle cx="440" cy="480" r="3" fill="#a78bfa" filter="url(#glow)"/>
<circle cx="1000" cy="480" r="3" fill="#a78bfa" filter="url(#glow)"/>

<!-- Agent 1 -->
<g transform="translate(280, 480)">
  <circle cx="0" cy="0" r="75" fill="url(#ng-blue)" filter="url(#bigGlow)"/>
  <circle cx="0" cy="0" r="48" fill="rgba(10,10,15,0.85)" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="0" y="-2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30">📊</text>
  <text x="0" y="22" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#60a5fa">AGENT 1</text>
</g>
<text x="280" y="585" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Data Profiler</text>
<text x="280" y="605" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">Statistical fairness audit</text>

<!-- Agent 2 (CENTRAL - FOUNDRY IQ) -->
<g transform="translate(720, 480)">
  <!-- Outer pulse -->
  <circle cx="0" cy="0" r="100" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.3"/>
  <circle cx="0" cy="0" r="90" fill="url(#ng-purple)" filter="url(#bigGlow)"/>
  <circle cx="0" cy="0" r="56" fill="rgba(10,10,15,0.9)" stroke="#a78bfa" stroke-width="3"/>
  <text x="0" y="-2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34">⚖️</text>
  <text x="0" y="24" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#a78bfa">AGENT 2</text>
</g>
<text x="720" y="605" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#a78bfa">Decision Audit</text>
<text x="720" y="625" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#a78bfa">⬡ Foundry IQ Graph Reasoning</text>

<!-- Agent 3 -->
<g transform="translate(1160, 480)">
  <circle cx="0" cy="0" r="75" fill="url(#ng-green)" filter="url(#bigGlow)"/>
  <circle cx="0" cy="0" r="48" fill="rgba(10,10,15,0.85)" stroke="#4ade80" stroke-width="2.5"/>
  <text x="0" y="-2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30">📝</text>
  <text x="0" y="22" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#4ade80">AGENT 3</text>
</g>
<text x="1160" y="585" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Transparency</text>
<text x="1160" y="605" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">Synthesis + counterfactuals</text>

<!-- Foundry IQ KG bottom -->
<g transform="translate(180, 660)">
  <rect x="0" y="0" width="1240" height="78" rx="12" fill="rgba(167,139,250,0.06)" stroke="rgba(167,139,250,0.3)" stroke-width="1.5"/>
  <text x="620" y="22" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#a78bfa" letter-spacing="2">⬡ MICROSOFT FOUNDRY IQ — ETHICAL REASONING KNOWLEDGE GRAPH</text>
  <text x="170" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#a78bfa">5</text>
  <text x="170" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#94a3b8" letter-spacing="1">ETHICAL PRINCIPLES</text>
  <text x="430" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#60a5fa">3</text>
  <text x="430" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#94a3b8" letter-spacing="1">FAIRNESS METRICS</text>
  <text x="700" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#4ade80">6</text>
  <text x="700" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#94a3b8" letter-spacing="1">CONTEXTUAL RULES</text>
  <text x="970" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#fbbf24">6</text>
  <text x="970" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#94a3b8" letter-spacing="1">MITIGATION STRATEGIES</text>
  <text x="1190" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#ec4899">78</text>
  <text x="1190" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#94a3b8" letter-spacing="1">EVAL TESTS · 100%</text>
</g>

<!-- KG arrow up to Agent 2 -->
<line x1="720" y1="660" x2="720" y2="590" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

<rect x="2" y="2" width="1596" height="836" rx="16" fill="none" stroke="rgba(167,139,250,0.2)" stroke-width="2"/>
</svg>
</body></html>
